<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernquest – Bosskampf am Handy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.fd{font-family:Fredoka,Nunito,sans-serif}
.pad{border:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font:700 19px Nunito,sans-serif;cursor:pointer;min-height:150px}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1F1A3D; color: #fff; display: flex; flex-direction: column; padding: 20px 18px 24px; box-sizing: border-box; gap: 18px; font-family: Nunito, system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 12px; font-weight: 800; color: #C9C2F2; text-transform: uppercase; letter-spacing: 1.5px">Bosskampf · Klasse 5b</span>
      <span class="fd" style="font-size: 22px; font-weight: 600">Frage 6 – schau zum Beamer</span>
    </div>
    <div style="width: 56px; height: 56px; position: relative" role="timer" aria-label="Noch 12 Sekunden">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="23" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6"></circle><circle cx="28" cy="28" r="23" fill="none" stroke="#FFC531" stroke-width="6" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="58" transform="rotate(-90 28 28)"></circle></svg>
      <span class="fd" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">12</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: #C9C2F2"><span>Kompass-Golem</span><span>640 / 1000</span></div>
    <div style="height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden"><div style="width: 64%; height: 100%; background: #E0344B"></div></div>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px">
    <button class="pad" style="background: #2459B8; box-shadow: 0 6px 0 #173C80"><svg width="56" height="56" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 4 41 38H3Z" fill="#fff"></path></svg>Nullmeridian</button>
    <button class="pad" style="background: #B5541C; box-shadow: 0 6px 0 #7A3610"><svg width="56" height="56" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 2 42 22 22 42 2 22Z" fill="#fff"></path></svg>Äquator</button>
    <button class="pad" style="background: #13804A; box-shadow: 0 6px 0 #0B5E35"><svg width="56" height="56" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="#fff"></circle></svg>Polarkreis</button>
    <button class="pad" style="background: #6A2FC4; box-shadow: 0 6px 0 #45208A"><svg width="56" height="56" viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="4" fill="#fff"></rect></svg>Wendekreis</button>
  </div>

  <div style="background: rgba(255,255,255,.08); border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 50%; background: #E8577A; display: flex; align-items: center; justify-content: center; font: 600 18px Fredoka, sans-serif">C</span>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span class="fd" style="font-size: 16px; font-weight: 600">Deine Serie: 4 richtig</span>
      <span style="font-size: 13px; color: #C9C2F2">Schnell und richtig = mehr Schaden</span>
    </div>
    <span class="fd" style="background: #FFC531; color: #4A3300; border-radius: 99px; padding: 4px 12px; font-size: 16px; font-weight: 600">× 2</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</html>
