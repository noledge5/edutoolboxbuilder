<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernquest – Dein Held</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.fd{font-family:Fredoka,Nunito,sans-serif}
.chip{border:2px solid #DCD6F5;background:#fff;border-radius:99px;padding:8px 14px;font:800 14px Nunito,sans-serif;color:#57527A;white-space:nowrap;min-height:40px;cursor:pointer}
.chip.on{background:#5B3FD9;border-color:#5B3FD9;color:#fff}
.item{position:relative;background:#fff;border:2px solid #DCD6F5;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 #DCD6F5;cursor:pointer;font-family:Nunito,sans-serif;color:#1F1A3D}
.item.eq{border-color:#5B3FD9;box-shadow:0 3px 0 #5B3FD9;background:#ECE7FF}
.item.lock{background:#EEEBF8;box-shadow:none;cursor:default}
.rar{display:flex;gap:2px}
.rar i{width:6px;height:6px;border-radius:50%;display:block}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0FF; display: flex; flex-direction: column; font-family: Nunito, system-ui, sans-serif; color: #1F1A3D">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px">
    <a href="Main.dc.html" aria-label="Zurück zur Karte" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #57527A"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
    <h1 class="fd" style="margin: 0; flex: 1; font-size: 26px; font-weight: 600">Dein Held</h1>
    <span class="fd" style="display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 600; color: #7A5600; background: #fff; border: 2px solid #DCD6F5; border-radius: 99px; padding: 4px 12px 4px 6px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFC531"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#C98F00" stroke-width="2"></circle></svg>135</span>
  </div>

  <!-- avatar stage -->
  <div style="margin: 0 16px; height: 268px; border-radius: 24px; overflow: hidden; position: relative; background: #BFE3F2">
    <svg width="358" height="268" viewBox="0 0 358 268" aria-hidden="true" style="position: absolute; inset: 0">
      <rect width="358" height="268" fill="#BFE3F2"></rect>
      <circle cx="292" cy="58" r="26" fill="#FFE07A"></circle>
      <path d="M0 190 60 120l50 50 60-80 80 90 50-40 58 50v78H0Z" fill="#8FC7A6"></path>
      <path d="M0 210c60-24 120-24 179-8s120 14 179-6v72H0Z" fill="#5FA77E"></path>
      <ellipse cx="179" cy="240" rx="70" ry="12" fill="#3F7F5B" opacity=".5"></ellipse>
      <!-- cape -->
      <path d="M140 140h78l22 98h-122Z" fill="#5B3FD9"></path>
      <!-- body -->
      <rect x="146" y="138" width="66" height="84" rx="26" fill="#2F6FDB"></rect>
      <rect x="146" y="176" width="66" height="10" fill="#8A4B1F"></rect>
      <rect x="172" y="174" width="14" height="14" rx="3" fill="#FFC531"></rect>
      <rect x="156" y="216" width="18" height="24" rx="8" fill="#3B2A1A"></rect>
      <rect x="184" y="216" width="18" height="24" rx="8" fill="#3B2A1A"></rect>
      <!-- head -->
      <circle cx="179" cy="108" r="40" fill="#F2C9A0"></circle>
      <circle cx="165" cy="110" r="5.5" fill="#1F1A3D"></circle>
      <circle cx="193" cy="110" r="5.5" fill="#1F1A3D"></circle>
      <circle cx="167" cy="108" r="1.8" fill="#fff"></circle>
      <circle cx="195" cy="108" r="1.8" fill="#fff"></circle>
      <path d="M170 126c6 5 12 5 18 0" fill="none" stroke="#1F1A3D" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="154" cy="122" r="6" fill="#F29A9A" opacity=".6"></circle>
      <circle cx="204" cy="122" r="6" fill="#F29A9A" opacity=".6"></circle>
      <!-- explorer hat -->
      <ellipse cx="179" cy="80" rx="62" ry="12" fill="#8A6A3A"></ellipse>
      <path d="M146 80c0-26 14-40 33-40s33 14 33 40Z" fill="#A9844C"></path>
      <rect x="146" y="70" width="66" height="9" fill="#5B3FD9"></rect>
      <!-- tool: telescope -->
      <g transform="rotate(-28 236 170)"><rect x="214" y="160" width="58" height="16" rx="5" fill="#C98F00"></rect><rect x="262" y="156" width="16" height="24" rx="4" fill="#8A6A3A"></rect><rect x="208" y="163" width="10" height="10" rx="3" fill="#8A6A3A"></rect></g>
      <circle cx="214" cy="178" r="11" fill="#F2C9A0"></circle>
      <!-- companion owl -->
      <g transform="translate(92 168)"><ellipse cx="0" cy="22" rx="22" ry="26" fill="#9B6B43"></ellipse><ellipse cx="0" cy="30" rx="13" ry="15" fill="#E8C9A0"></ellipse><circle cx="-8" cy="12" r="8" fill="#fff"></circle><circle cx="8" cy="12" r="8" fill="#fff"></circle><circle cx="-8" cy="12" r="4" fill="#1F1A3D"></circle><circle cx="8" cy="12" r="4" fill="#1F1A3D"></circle><path d="m-3 19 3 5 3-5Z" fill="#FFC531"></path><path d="m-18 0 6 6M18 0l-6 6" stroke="#9B6B43" stroke-width="6" stroke-linecap="round"></path></g>
    </svg>
    <div style="position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.92); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column">
      <span class="fd" style="font-size: 16px; font-weight: 600">Clara M.</span>
      <span style="font-size: 12px; font-weight: 800; color: #5B3FD9">Heldenstufe 4 · Kartenkunde</span>
    </div>
    <div style="position: absolute; right: 12px; bottom: 12px; background: #1F1A3D; color: #fff; border-radius: 12px; padding: 6px 10px; font-size: 12px; font-weight: 700; max-width: 150px">Bonus: +5 % Münzen, +1 Herz</div>
  </div>

  <!-- tabs -->
  <div style="display: flex; gap: 8px; padding: 16px 16px 12px; overflow-x: auto" role="tablist" aria-label="Teile">
    <button class="chip on" role="tab" aria-selected="true">Kopf</button>
    <button class="chip" role="tab" aria-selected="false">Augen</button>
    <button class="chip" role="tab" aria-selected="false">Kleidung</button>
    <button class="chip" role="tab" aria-selected="false">Werkzeug</button>
    <button class="chip" role="tab" aria-selected="false">Begleiter</button>
    <button class="chip" role="tab" aria-selected="false">Hintergrund</button>
  </div>

  <!-- items -->
  <div style="flex: 1; overflow-y: auto; padding: 0 16px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <button class="{{it.cls}}" aria-label="{{it.aria}}">
        <sc-if value="{{it.eq}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -9px; right: -6px; background: #5B3FD9; color: #fff; font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 7px">Angelegt</span></sc-if>
        <svg width="52" height="44" viewBox="0 0 52 44" aria-hidden="true">
          <sc-if value="{{it.locked}}" hint-placeholder-val="{{ false }}"><circle cx="26" cy="22" r="18" fill="#DCD6F5"></circle><text x="26" y="30" text-anchor="middle" font-family="Fredoka" font-size="22" font-weight="600" fill="#77729A">?</text></sc-if>
          <sc-if value="{{it.open}}" hint-placeholder-val="{{ true }}"><ellipse cx="26" cy="32" rx="22" ry="6" fill="{{it.c2}}"></ellipse><path d="M10 32c0-16 7-26 16-26s16 10 16 26Z" fill="{{it.c1}}"></path><rect x="10" y="25" width="32" height="6" fill="{{it.c2}}"></rect></sc-if>
        </svg>
        <span style="font-size: 13px; font-weight: 800; text-align: center; line-height: 1.2">{{it.name}}</span>
        <span class="rar" aria-hidden="true"><sc-for list="{{it.dots}}" as="d" hint-placeholder-count="5"><i style="background: {{d.c}}"></i></sc-for></span>
        <span style="font-size: 11px; font-weight: 800; color: {{it.rc}}">{{it.rar}}</span>
      </button>
    </sc-for>
  </div>

  <!-- chest + shop -->
  <div style="padding: 12px 16px 20px; background: #fff; border-top: 2px solid #DCD6F5; display: flex; gap: 10px; align-items: center">
    <svg width="48" height="42" viewBox="0 0 52 46" aria-hidden="true"><rect x="3" y="18" width="46" height="25" rx="4" fill="#8A4B1F"></rect><path d="M3 18c0-9 6-15 23-15s23 6 23 15Z" fill="#A65E2A"></path><rect x="3" y="16" width="46" height="6" fill="#FFC531"></rect><rect x="22" y="16" width="8" height="14" rx="2" fill="#FFC531"></rect></svg>
    <div style="flex: 1; display: flex; flex-direction: column"><span class="fd" style="font-size: 16px; font-weight: 600">1 Truhe bereit</span><span style="font-size: 12px; color: #57527A">für dein Wochenziel</span></div>
    <a href="Truhe.dc.html" class="fd" style="background: #FFC531; color: #4A3300; border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 600; text-decoration: none; box-shadow: 0 4px 0 #C98F00">Öffnen</a>
    <button class="fd" style="background: #fff; color: #5B3FD9; border: 2px solid #DCD6F5; border-radius: 14px; padding: 10px 14px; font-size: 16px; font-weight: 600; box-shadow: 0 4px 0 #DCD6F5; cursor: pointer">Laden</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['Gewöhnlich', '#6E6990'], ['Ungewöhnlich', '#13804A'], ['Selten', '#2459B8'], ['Episch', '#6A2FC4'], ['Legendär', '#8A6100']
    ];
    const list = [
      ['Entdeckerhut', 2, '#A9844C', '#8A6A3A', true, false],
      ['Wollmütze', 0, '#E8577A', '#B83A5C', false, false],
      ['Stirnband', 1, '#1F8A70', '#155E4C', false, false],
      ['Zauberhut', 3, '#5B3FD9', '#3F28A8', false, false],
      ['Ritterhelm', 1, '#9AA3B5', '#6B7487', false, false],
      ['Piratenhut', 2, '#2B2640', '#C98F00', false, false],
      ['???', 4, '', '', false, true],
      ['???', 3, '', '', false, true],
      ['???', 0, '', '', false, true]
    ];
    const items = list.map((x) => ({
      name: x[0], rar: R[x[1]][0], rc: R[x[1]][1], c1: x[2], c2: x[3], eq: x[4], locked: x[5], open: !x[5],
      cls: 'item' + (x[4] ? ' eq' : '') + (x[5] ? ' lock' : ''),
      aria: x[5] ? 'Noch nicht gefunden, ' + R[x[1]][0] : x[0] + ', ' + R[x[1]][0] + (x[4] ? ', angelegt' : ''),
      dots: [0, 1, 2, 3, 4].map((i) => ({ c: i <= x[1] ? R[x[1]][1] : '#DCD6F5' }))
    }));
    return { items };
  }
}
</script>
</body>
</html>
